name: Feature Request
description: Suggest a new feature or improvement
title: '[FEATURE] '
labels: ['enhancement', 'needs-triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! We love ideas to improve e-xode-vue-ssr. Please give as much context as possible.

  - type: checkboxes
    attributes:
      label: Have you checked?
      options:
        - label: This feature does not already exist
          required: true
        - label: There is no similar feature request in the existing issues
          required: true

  - type: textarea
    attributes:
      label: Feature Description
      description: A clear description of the proposed feature
      placeholder: 'I would like the authentication system to support SMS authentication in addition to email...'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Use Case / Motivation
      description: Why would this feature be useful? What problem does it solve?
      placeholder: |
        - It would allow users without a valid email to...
        - It improves the user experience for...
        - It makes the starter kit compatible with...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: How should this feature be implemented?
      placeholder: |
        Option 1: Add an SMS provider (Twilio)
        Option 2: Use an existing API
        Option 3: Another approach...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternative Solutions Considered
      description: Are there other ways to solve this problem?
      placeholder: |
        Alternative 1: Use an existing 2FA
        Alternative 2: Ignore this case and do it differently
        Why I prefer my proposed solution...

  - type: textarea
    attributes:
      label: Additional Context
      description: Any other information that could help?
      placeholder: |
        - Links to similar projects
        - Proof-of-concept code or prototypes
        - Documentation references
        - Number of affected users

  - type: dropdown
    attributes:
      label: Priority
      description: How important is it for your use case?
      options:
        - 'Nice to have (not urgent)'
        - 'Important (would like to see it soon)'
        - 'Critical (blocks my production)'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Affected Area
      description: Which part of the project is affected?
      options:
        - 'Frontend / UI / Components'
        - 'Backend / API / Routes'
        - 'Database / Schema'
        - 'Authentication / Security'
        - 'Deployment / DevOps'
        - 'Documentation'
        - 'Testing'
        - 'Performance'
        - 'Accessibility'
        - 'i18n / Localization'
        - 'Other'
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: I can help
      options:
        - label: I would be happy to collaborate on or develop this feature
          required: false
        - label: I can provide funding/resources if needed
          required: false

  - type: dropdown
    attributes:
      label: Estimated Effort
      description: Do you have an idea of the size of the effort?
      options:
        - 'Small (< 4 hours) - simple fix'
        - 'Medium (4-16 hours) - can be split into 2-3 PRs'
        - 'Large (16-40 hours) - several days of work'
        - 'Very Large (> 40 hours) - major project'

  - type: markdown
    attributes:
      value: |
        ---
        **Thank you!** We will review this suggestion and give feedback as soon as possible.

        For more information, see [CONTRIBUTING.md](../../CONTRIBUTING.md#proposer-une-feature).

name: Question / Help
description: Ask a question or request help
title: '[QUESTION] '
labels: ['question', 'documentation']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Do you have a question about how to use e-xode-vue-ssr?

        Before asking a question, check:
        - README.en.md or README.fr.md
        - [Troubleshooting Guide](../../docs/TROUBLESHOOTING.md)
        - [FAQ](../../docs/TROUBLESHOOTING.md#faq)
        - Existing discussions

  - type: textarea
    attributes:
      label: Your Question
      description: What is your question? Be as specific as possible
      placeholder: 'I would like to know how to... I am trying to... How can I...?'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Context / What You Tried
      description: What is your situation? What have you already tried?
      placeholder: |
        I tried to...
        I looked in the documentation...
        Here is what I found...
        But I still do not understand how...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment
      description: Relevant details about your setup
      value: |
        - Node: (e.g. 18.0.0)
        - npm: (e.g. 9.0.0)
        - OS: (e.g. macOS, Windows, Linux)
        - MongoDB: (local or Atlas)
        - Framework/Extensions: (e.g. TypeScript, Docker)

  - type: dropdown
    attributes:
      label: Category
      description: Which category fits best?
      options:
        - 'Setup / Installation'
        - 'Development'
        - 'API Usage'
        - 'Authentication'
        - 'Database'
        - 'Deployment'
        - 'Performance'
        - 'Error / Bug (should create bug report)'
        - 'Documentation'
        - 'Other'
    validations:
      required: false

  - type: textarea
    attributes:
      label: Referenced Documentation
      description: Did you consult specific documentation? Which one?
      placeholder: |
        - [QUICK_START.md](../../docs/QUICK_START.en.md)
        - [DEVELOPER_GUIDE.md](../../docs/DEVELOPER_GUIDE.md)
        - [API.md](../../docs/API.md)
        But I did not find...

  - type: markdown
    attributes:
      value: |
        ---

        **Tips for a better answer:**
        - Be specific rather than vague
        - Include links to relevant docs/issues
        - Share the actual errors or output
        - Describe what you are trying to accomplish (your end goal)

        **Useful links:**
        - [Documentation](../../docs/INDEX.md)
        - [Existing Discussions](https://github.com/e-xode/e-xode-vue-ssr/discussions)
        - [Stack Overflow tag: vue-ssr](https://stackoverflow.com/questions/tagged/vue-ssr)

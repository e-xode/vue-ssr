name: Bug Report
description: Report a bug in e-xode-vue-ssr
title: '[BUG] '
labels: ['bug', 'needs-triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below to help us identify and fix the problem quickly.

  - type: checkboxes
    attributes:
      label: Have you checked?
      options:
        - label: I searched the existing issues for a similar bug report
          required: true
        - label: This bug is not caused by my local environment or setup (I tested in production or in the vanilla starter kit)
          required: false

  - type: textarea
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug. What is not working?
      placeholder: 'Example: After the code verification, the user is not redirected to the dashboard...'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug
      value: |
        1. Go to...
        2. Click on...
        3. Enter...
        4. Observe the error...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: 'The user should be redirected to /dashboard...'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots/Videos
      description: If applicable, add screenshots or videos
      placeholder: Drag and drop images or paste video links here

  - type: textarea
    attributes:
      label: Error Messages
      description: If there is a console error, copy the full message
      render: shell
      placeholder: |
        TypeError: Cannot read property 'email' of undefined
          at EmailForm.vue:45
          at processTicksAndRejections...

  - type: dropdown
    attributes:
      label: Environment
      options:
        - 'npm run dev (development)'
        - 'npm run prod (local production)'
        - 'Docker development'
        - 'Docker production'
        - 'Heroku'
        - 'AWS EC2'
        - 'Other (please specify)'
    validations:
      required: true

  - type: input
    attributes:
      label: Other environment (if applicable)
      description: If you selected "Other", specify it here

  - type: textarea
    attributes:
      label: Environment Details
      description: Details about your environment
      value: |
        - Node version: (e.g. 18.0.0)
        - npm version: (e.g. 9.0.0)
        - OS: (e.g. macOS 13.0, Windows 11, Ubuntu 22.04)
        - Browser: (e.g. Chrome 120, Firefox 121)
        - MongoDB version: (e.g. 6.0, on Atlas)

  - type: textarea
    attributes:
      label: Relevant Logs
      description: Copy the relevant server or console logs
      render: shell
      placeholder: |
        npm run dev
        > node server.js
        [APP] Server running on port 3002
        [APP] MongoDB connected
        [ERROR] Unexpected token in JSON

  - type: textarea
    attributes:
      label: Specific Configuration or Setup
      description: Is there anything unusual in your setup?
      placeholder: 'Example: I did not change .env, I use MongoDB Atlas, etc.'

  - type: textarea
    attributes:
      label: Additional Context
      description: Any other information that could help?
      placeholder: 'Example: I tried X but it did not work, I also noticed...'

  - type: checkboxes
    attributes:
      label: I can contribute a fix
      options:
        - label: I would be happy to submit a PR to fix this bug
          required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Thank you!** We will look into this bug as soon as possible. If details are missing, we will ask you for them.

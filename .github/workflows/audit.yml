name: audit

# Audit of the repository STATE, deliberately separate from security.yml, which judges the diff.
#
# This workflow is allowed to be red without anyone being at fault: it turns red as soon as a
# vulnerability is published for an already-installed dependency, with no commit involved. It is
# a debt indicator, not a merge gate, and that is exactly why it must NOT run on pull requests.
# While it did, a PR fixing a vulnerability was marked red by the vulnerabilities job.
# See e-xode/scripts#9.
#
# Never add it to the `required_status_checks` of master.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'npm'
      - name: npm audit (runtime, high and above)
        run: npm audit --omit=dev --audit-level=high

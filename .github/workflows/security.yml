name: security

# This workflow ONLY judges the diff. The audit of the repository state lives in audit.yml, on a
# schedule, and no longer on pull requests.
#
# Why: `npm audit --audit-level=high` audited the whole tree, so it stayed red while any
# vulnerability was open, including on a PR that fixed one. Seen twice in three weeks (runs
# 29870358431 and 30256414555). As a result the CI colour said nothing about the quality of the
# change, and nobody could use it as a guard rail any more. See e-xode/scripts#9.
#
# The vulnerability guard remains on the PR but is bounded to the diff: dependency-review only
# reports advisories INTRODUCED by the change. Public repository, so it is free.

on:
  push:
    branches: ['master', 'development']
  pull_request:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: gitleaks (free OSS image, blocking)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --redact --exit-code=1 --no-banner

  deps-review:
    # Pull requests only: the action compares two refs, it makes no sense on a push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
